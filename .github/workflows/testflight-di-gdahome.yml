# Di passaggio: cosa resta su TestFlight di GdAHome nel vecchio account
# Apple, che blocca il trasferimento dell'app alla societa'. Solo lettura:
# chiede ad App Store Connect con la chiave di sempre e scrive quante build,
# gruppi, tester e campi sono ancora pieni (mai i contenuti: il registro e'
# pubblico). Si toglie a trasferimento fatto.
name: TestFlight di GdAHome

on:
  push:
    branches: [ccr-83e04bdb-tiz21h]
    paths: [.github/workflows/testflight-di-gdahome.yml]

permissions:
  contents: read

jobs:
  guarda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cosa resta
        env:
          CHIAVE: ${{ secrets.APPLE_CHIAVE_P8 }}
          CHIAVE_ID: ${{ secrets.APPLE_CHIAVE_ID }}
          EMITTENTE: ${{ secrets.APPLE_EMITTENTE }}
        run: |
          cat > guarda.mjs <<'FINE'
          import { createPrivateKey, sign } from "node:crypto";

          const b64u = (b) => Buffer.from(b).toString("base64url");
          const ora = Math.floor(Date.now() / 1000);
          const testa = b64u(JSON.stringify({ alg: "ES256", kid: process.env.CHIAVE_ID, typ: "JWT" }));
          const corpo = b64u(JSON.stringify({ iss: process.env.EMITTENTE, iat: ora, exp: ora + 15 * 60, aud: "appstoreconnect-v1" }));
          const firma = sign("sha256", Buffer.from(`${testa}.${corpo}`), {
            key: createPrivateKey(process.env.CHIAVE),
            dsaEncoding: "ieee-p1363",
          });
          const gettone = `${testa}.${corpo}.${b64u(firma)}`;

          const API = "https://api.appstoreconnect.apple.com";
          async function chiedi(dove) {
            const r = await fetch(dove.startsWith("http") ? dove : API + dove, {
              headers: { authorization: `Bearer ${gettone}` },
            });
            if (!r.ok) throw new Error(`${dove.split("?")[0]}: ${r.status} ${(await r.text()).slice(0, 300)}`);
            return r.json();
          }
          async function tutti(dove) {
            const dati = [], inclusi = [];
            while (dove) {
              const j = await chiedi(dove);
              dati.push(...(j.data ?? []));
              inclusi.push(...(j.included ?? []));
              dove = j.links?.next ?? null;
            }
            return { dati, inclusi };
          }
          const pieno = (v) => v !== null && v !== undefined && v !== "" && v !== false;
          const quali = (attributi, tranne = []) =>
            Object.entries(attributi ?? {}).filter(([k, v]) => !tranne.includes(k) && pieno(v)).map(([k]) => k);
          async function parte(titolo, fai) {
            try {
              await fai();
            } catch (errore) {
              console.log(`${titolo}: non si legge (${errore.message})`);
            }
          }

          const app = (await chiedi("/v1/apps?filter[bundleId]=com.gdahome.gdahome")).data?.[0];
          if (!app) {
            console.log("GdAHome non c'e' in questo account");
            process.exit(1);
          }
          console.log(`App: ${app.attributes.name} (${app.id})`);

          await parte("Build", async () => {
            const totale = (await chiedi(`/v1/builds?filter[app]=${app.id}&limit=1`)).meta?.paging?.total;
            const { dati, inclusi } = await tutti(
              `/v1/builds?filter[app]=${app.id}&filter[expired]=false&limit=200&include=preReleaseVersion` +
                "&fields[builds]=version,expired,processingState,uploadedDate,preReleaseVersion" +
                "&fields[preReleaseVersions]=version,platform",
            );
            const versioni = new Map(inclusi.filter((x) => x.type === "preReleaseVersions").map((x) => [x.id, x.attributes]));
            console.log(`\nBuild in tutto: ${totale ?? "?"}; non scadute: ${dati.length}`);
            for (const b of dati) {
              const v = versioni.get(b.relationships?.preReleaseVersion?.data?.id) ?? {};
              console.log(`  ${v.platform ?? "?"} ${v.version ?? "?"} (${b.attributes.version}) ${b.attributes.processingState}, caricata il ${b.attributes.uploadedDate?.slice(0, 10)}`);
            }
          });

          await parte("Gruppi", async () => {
            const { dati } = await tutti(`/v1/apps/${app.id}/betaGroups?limit=200&fields[betaGroups]=isInternalGroup,publicLinkEnabled`);
            const interni = dati.filter((g) => g.attributes.isInternalGroup).length;
            const conLink = dati.filter((g) => g.attributes.publicLinkEnabled).length;
            console.log(`\nGruppi: ${dati.length} (interni ${interni}, esterni ${dati.length - interni}, col link pubblico ${conLink})`);
          });

          await parte("Tester", async () => {
            const { dati } = await tutti(`/v1/betaTesters?filter[apps]=${app.id}&limit=200&fields[betaTesters]=state,inviteType`);
            const stati = {};
            for (const t of dati) stati[t.attributes.state ?? "?"] = (stati[t.attributes.state ?? "?"] ?? 0) + 1;
            console.log(`\nTester legati all'app: ${dati.length}`, JSON.stringify(stati));
          });

          await parte("Informazioni per i test", async () => {
            const { dati } = await tutti(`/v1/apps/${app.id}/betaAppLocalizations?limit=200`);
            console.log(`\nInformazioni per i test, lingue: ${dati.length}`);
            for (const l of dati) {
              const pieni = quali(l.attributes, ["locale"]);
              console.log(`  ${l.attributes.locale}: ${pieni.length ? "pieni " + pieni.join(", ") : "vuota"}`);
            }
          });

          await parte("Revisione beta", async () => {
            const r = (await chiedi(`/v1/apps/${app.id}/betaAppReviewDetail`)).data;
            const pieni = quali(r?.attributes);
            console.log(`\nRevisione beta: ${pieni.length ? "pieni " + pieni.join(", ") : "vuota"}`);
          });

          await parte("Contratto di licenza beta", async () => {
            const c = (await chiedi(`/v1/apps/${app.id}/betaLicenseAgreement`)).data;
            console.log(`\nContratto di licenza beta: ${pieno(c?.attributes?.agreementText) ? "pieno" : "vuoto"}`);
          });
          FINE
          node guarda.mjs
