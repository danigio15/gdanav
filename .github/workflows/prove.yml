name: Le prove

on:
  push:
  pull_request:

jobs:
  motore:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/gdanav_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.4
      - run: dart pub get
      - run: dart format -l 120 --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  integrazione:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt ruff
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - run: pytest

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  # Tutti i pezzi veri insieme: relay acceso, Home Assistant e app che si
  # parlano, e un Valhalla vero (mappa di prova di Utrecht) per i percorsi.
  insieme:
    runs-on: ubuntu-latest
    needs: [motore, integrazione, relay]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.4
      - run: npm ci
        working-directory: relay
      - run: pip install -r requirements_test.txt pyvalhalla
      - name: Accende Valhalla
        run: valhalla/prova_locale.sh "$RUNNER_TEMP/valhalla"
      - run: dart pub get
        working-directory: packages/gdanav_core
      - name: Accende il relay
        working-directory: relay
        run: |
          npx wrangler dev --port 8799 --ip 127.0.0.1 > ../wrangler.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/ | grep -q 426 && exit 0
            sleep 1
          done
          cat ../wrangler.log
          exit 1
      - run: pytest tests/test_relay_vero.py
        env:
          GDANAV_RELAY: ws://127.0.0.1:8799
      - run: dart test test/relay_vero_test.dart
        working-directory: packages/gdanav_core
        env:
          GDANAV_RELAY: ws://127.0.0.1:8799
      - run: dart test test/valhalla_test.dart test/viaggio_test.dart
        working-directory: packages/gdanav_core
        env:
          GDANAV_VALHALLA: http://127.0.0.1:8002/

  # L'APK da provare: a ogni push su main finisce nella release «anteprima»,
  # da scaricare dal telefono.
  apk:
    runs-on: ubuntu-latest
    needs: [app, motore]
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk gdanav.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gdanav-apk
          path: app/gdanav.apk
      - name: Pubblica l'anteprima
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          note="Versione di prova di gdanav, dal commit ${GITHUB_SHA::7}. Si installa sul telefono Android aprendo gdanav.apk (va permesso di installare app da fonti sconosciute). Firmata con la chiave di prova: non è per il Play Store."
          gh release view anteprima > /dev/null 2>&1 || gh release create anteprima --prerelease --title "gdanav · anteprima" --notes "$note"
          gh release upload anteprima gdanav.apk --clobber
          gh release edit anteprima --notes "$note"
