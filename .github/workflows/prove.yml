name: Le prove

on:
  push:
  pull_request:
  # Da GitHub, «Run workflow»: per esempio per rifare le foto degli svincoli.
  workflow_dispatch:

jobs:
  motore:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/gdanav_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.4
      - run: dart pub get
      - run: dart format -l 120 --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  integrazione:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt ruff
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - run: pytest

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      # Che si possa pubblicare: il bundle lo fa wrangler, non node.
      - run: npx wrangler deploy --dry-run --outdir dist

  # Il relay su Cloudflare, a ogni push su main, su gdanav.gdahome.org (il
  # dominio è su Cloudflare), con i segreti CLOUDFLARE_API_TOKEN e
  # CLOUDFLARE_ACCOUNT_ID. Senza segreti si salta.
  pubblica-relay:
    needs: [relay]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Pubblica su Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOST: gdanav.gdahome.org
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Relay non pubblicato: mancano i segreti CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID."
            exit 0
          fi
          # In cima al file: dopo le tabelle [[...]] finirebbe dentro l'ultima.
          sed -i "/^compatibility_date/a routes = [{ pattern = \"$HOST\", custom_domain = true }]" wrangler.toml
          npx wrangler deploy
      - name: Il relay risponde
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          [ -z "$CLOUDFLARE_API_TOKEN" ] && exit 0
          # Il primo certificato del dominio può metterci qualche minuto.
          for i in $(seq 1 30); do
            if curl -sf "https://gdanav.gdahome.org/v1/segnalazioni?lat=45&lon=9" > /dev/null \
              && curl -sf "https://gdanav.gdahome.org/privacy" | grep -q "Informativa"; then echo "ok"; exit 0; fi
            sleep 10
          done
          echo "::error::https://gdanav.gdahome.org non risponde"; exit 1

  # Tutti i pezzi veri insieme: relay acceso, Home Assistant e app che si
  # parlano, e un Valhalla vero (mappa di prova di Utrecht) per i percorsi.
  insieme:
    runs-on: ubuntu-latest
    needs: [motore, integrazione, relay]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.4
      - run: npm ci
        working-directory: relay
      - run: pip install -r requirements_test.txt pyvalhalla
      - name: Accende Valhalla
        run: valhalla/prova_locale.sh "$RUNNER_TEMP/valhalla"
      - run: dart pub get
        working-directory: packages/gdanav_core
      - name: Accende il relay
        working-directory: relay
        run: |
          npx wrangler dev --port 8799 --ip 127.0.0.1 > ../wrangler.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/ | grep -q 426 && exit 0
            sleep 1
          done
          cat ../wrangler.log
          exit 1
      - run: pytest tests/test_relay_vero.py
        env:
          GDANAV_RELAY: ws://127.0.0.1:8799
      - run: dart test test/relay_vero_test.dart test/segnalazioni_test.dart
        working-directory: packages/gdanav_core
        env:
          GDANAV_RELAY: ws://127.0.0.1:8799
      - run: dart test test/valhalla_test.dart test/viaggio_test.dart
        working-directory: packages/gdanav_core
        env:
          GDANAV_VALHALLA: http://127.0.0.1:8002/

  # Il viaggio vero, coi server pubblici: quanto ci mette ogni pezzo. Non
  # blocca niente: i server degli altri possono essere lenti.
  rete:
    needs: [pubblica-relay]
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: packages/gdanav_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.4
      - run: dart pub get
      - run: dart test test/viaggio_rete_test.dart --reporter expanded
        env:
          GDANAV_RETE: "1"
      - name: Com'è fatto il traffico TomTom
        working-directory: .
        env:
          TOMTOM: ${{ secrets.GDANAV_TOMTOM_CHIAVE }}
        run: |
          pip install mapbox-vector-tile
          python3 tools/sonda_traffico.py

  # Le foto vere delle auto, da Wikimedia Commons: solo quando il commit lo
  # chiede con «[foto-auto]». Il JSON va nella release «anteprima», da
  # controllare e mettere in app/assets.
  foto-auto:
    if: contains(github.event.head_commit.message, '[foto-auto]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: packages/gdanav_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.4
      - run: dart pub get
      - run: dart run tool/foto_auto.dart foto_auto.json | tee foto_auto.tsv
      - name: Nella release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view anteprima > /dev/null 2>&1 || gh release create anteprima --prerelease --title "gdanav · anteprima" --notes "anteprima"
          gh release upload anteprima foto_auto.json foto_auto.tsv --clobber

  # Le colonnine rapide per l'archivio dentro l'app, dagli estratti completi
  # di OpenStreetMap (Geofabrik) filtrati con osmium: niente Overpass, che è
  # spesso sovraccarico. Solo quando il commit lo chiede con «[colonnine]»;
  # il JSON va nella release «anteprima», da mettere in app/assets.
  colonnine-dati:
    if: contains(github.event.head_commit.message, '[colonnine]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.4
      - run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - name: Estratti e colonnine
        working-directory: ${{ runner.temp }}
        run: |
          set -e
          for zona in europe/italy europe/switzerland europe/austria europe/slovenia europe/croatia \
                      europe/monaco europe/liechtenstein europe/france/provence-alpes-cote-d-azur; do
            nome=$(basename $zona)
            curl -sSfL --retry 5 -o $nome.osm.pbf https://download.geofabrik.de/$zona-latest.osm.pbf
            osmium tags-filter $nome.osm.pbf nwr/amenity=charging_station -o $nome-cs.osm.pbf
            osmium export $nome-cs.osm.pbf -f geojsonseq --add-unique-id=type_id -o $nome.colonnine.geojsonseq
            osmium tags-filter $nome.osm.pbf n/highway=speed_camera -o $nome-av.osm.pbf
            osmium export $nome-av.osm.pbf -f geojsonseq -o $nome.autovelox.geojsonseq
            echo "$nome: $(wc -l < $nome.colonnine.geojsonseq) colonnine, $(wc -l < $nome.autovelox.geojsonseq) autovelox"
            rm $nome.osm.pbf
          done
      - run: dart pub get
        working-directory: packages/gdanav_core
      - run: dart run tool/colonnine_osm.dart colonnine.json ${{ runner.temp }}/*.colonnine.geojsonseq
        working-directory: packages/gdanav_core
      - run: dart run tool/autovelox_osm.dart autovelox.json ${{ runner.temp }}/*.autovelox.geojsonseq
        working-directory: packages/gdanav_core
      - name: Nella release
        working-directory: packages/gdanav_core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view anteprima > /dev/null 2>&1 || gh release create anteprima --prerelease --title "gdanav · anteprima" --notes "anteprima"
          gh release upload anteprima colonnine.json autovelox.json --clobber

  # L'APK da provare: a ogni push su main finisce nella release «anteprima»,
  # da scaricare dal telefono.
  apk:
    runs-on: ubuntu-latest
    needs: [app, motore]
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
      - run: flutter pub get
      # Le chiavi facoltative (TomTom: traffico e colonnine libere/occupate;
      # Open Charge Map) arrivano dai segreti del repository.
      # Il numero di versione sale a ogni build: il Play Store non accetta due
      # volte lo stesso.
      - run: >-
          flutter build apk --release --build-number=${{ github.run_number }}
          --dart-define=GDANAV_TUTTO_SBLOCCATO=true
          --dart-define=GDANAV_TOMTOM_CHIAVE="$TOMTOM"
          --dart-define=GDANAV_OCM_CHIAVE="$OCM"
        env:
          TOMTOM: ${{ secrets.GDANAV_TOMTOM_CHIAVE }}
          OCM: ${{ secrets.GDANAV_OCM_CHIAVE }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk gdanav.apk
      # Il pacchetto per il Play Store (test interno): da lì Android Auto
      # mostra l'app senza «Origini sconosciute». Qui Premium si compra;
      # nell'APK d'anteprima qui sopra è già sbloccato.
      - run: >-
          flutter build appbundle --release --build-number=${{ github.run_number }}
          --dart-define=GDANAV_TOMTOM_CHIAVE="$TOMTOM"
          --dart-define=GDANAV_OCM_CHIAVE="$OCM"
        env:
          TOMTOM: ${{ secrets.GDANAV_TOMTOM_CHIAVE }}
          OCM: ${{ secrets.GDANAV_OCM_CHIAVE }}
      - run: cp build/app/outputs/bundle/release/app-release.aab gdanav.aab
      - uses: actions/upload-artifact@v4
        with:
          name: gdanav-apk
          path: |
            app/gdanav.apk
            app/gdanav.aab
      - name: Pubblica l'anteprima
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          note="Versione di prova di gdanav, dal commit ${GITHUB_SHA::7} (versione ${GITHUB_RUN_NUMBER}). gdanav.apk si installa sul telefono aprendolo (va permesso di installare app da fonti sconosciute). gdanav.aab è il pacchetto da caricare nella Play Console, nel test interno."
          gh release view anteprima > /dev/null 2>&1 || gh release create anteprima --prerelease --title "gdanav · anteprima" --notes "$note"
          gh release upload anteprima gdanav.apk gdanav.aab --clobber
          gh release edit anteprima --notes "$note"
