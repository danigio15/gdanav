name: Le prove

on:
  push:
  pull_request:
  # Da GitHub, «Run workflow»: per esempio per rifare le foto degli svincoli.
  workflow_dispatch:

jobs:
  motore:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/gdanav_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.4
      - run: dart pub get
      - run: dart format -l 120 --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
      # Lo schermo di gdanav sta nel pacchetto (lo porta dentro anche gdahome):
      # le prove sono lì. L'app è l'involucro, e basta che compili.
      - run: flutter pub get
        working-directory: packages/gdanav_app
      - run: flutter analyze
        working-directory: packages/gdanav_app
      - run: flutter test
        working-directory: packages/gdanav_app
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app

  integrazione:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt ruff
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - run: pytest

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      # Che si possa pubblicare: il bundle lo fa wrangler, non node.
      - run: npx wrangler deploy --dry-run --outdir dist

  # Il relay su Cloudflare, a ogni push su main, su gdanav.gdahome.org (il
  # dominio è su Cloudflare), con i segreti CLOUDFLARE_API_TOKEN e
  # CLOUDFLARE_ACCOUNT_ID. Senza segreti si salta.
  pubblica-relay:
    needs: [relay]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Pubblica su Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOST: gdanav.gdahome.org
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Relay non pubblicato: mancano i segreti CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID."
            exit 0
          fi
          # In cima al file: dopo le tabelle [[...]] finirebbe dentro l'ultima.
          sed -i "/^compatibility_date/a routes = [{ pattern = \"$HOST\", custom_domain = true }]" wrangler.toml
          npx wrangler deploy
      - name: Il relay risponde
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          [ -z "$CLOUDFLARE_API_TOKEN" ] && exit 0
          # Il primo certificato del dominio può metterci qualche minuto.
          for i in $(seq 1 30); do
            if curl -sf "https://gdanav.gdahome.org/v1/segnalazioni?lat=45&lon=9" > /dev/null \
              && curl -sf "https://gdanav.gdahome.org/privacy" | grep -q "Informativa"; then echo "ok"; exit 0; fi
            sleep 10
          done
          echo "::error::https://gdanav.gdahome.org non risponde"; exit 1

  # Tutti i pezzi veri insieme: relay acceso, Home Assistant e app che si
  # parlano, e un Valhalla vero (mappa di prova di Utrecht) per i percorsi.
  insieme:
    runs-on: ubuntu-latest
    needs: [motore, integrazione, relay]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.4
      - run: npm ci
        working-directory: relay
      - run: pip install -r requirements_test.txt pyvalhalla
      - name: Accende Valhalla
        run: valhalla/prova_locale.sh "$RUNNER_TEMP/valhalla"
      - run: dart pub get
        working-directory: packages/gdanav_core
      - name: Accende il relay
        working-directory: relay
        run: |
          npx wrangler dev --port 8799 --ip 127.0.0.1 > ../wrangler.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/ | grep -q 426 && exit 0
            sleep 1
          done
          cat ../wrangler.log
          exit 1
      - run: pytest tests/test_relay_vero.py
        env:
          GDANAV_RELAY: ws://127.0.0.1:8799
      - run: dart test test/relay_vero_test.dart test/segnalazioni_test.dart
        working-directory: packages/gdanav_core
        env:
          GDANAV_RELAY: ws://127.0.0.1:8799
      - run: dart test test/valhalla_test.dart test/viaggio_test.dart
        working-directory: packages/gdanav_core
        env:
          GDANAV_VALHALLA: http://127.0.0.1:8002/

  # Il viaggio vero, coi server pubblici: quanto ci mette ogni pezzo. Non
  # blocca niente: i server degli altri possono essere lenti.
  # Gira anche sui rami di lavoro (dove il relay non si pubblica), per
  # provare coi dati veri prima di pubblicare l'APK.
  rete:
    needs: [pubblica-relay]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    defaults:
      run:
        working-directory: packages/gdanav_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.4
      - run: dart pub get
      - run: dart test test/viaggio_rete_test.dart --reporter expanded
        env:
          GDANAV_RETE: "1"
          GDANAV_PREZZI: ${{ github.workspace }}/prezzi_napoli.json
          GDANAV_COLONNINE: ${{ github.workspace }}/colonnine_utrecht.json
          GDANAV_TOMTOM: ${{ secrets.GDANAV_TOMTOM_CHIAVE }}
          GDANAV_ANTEPRIME: ${{ github.workspace }}
      # Prezzi veri di Napoli e colonnine vere di Utrecht nella release, per
      # le anteprime dell'app.
      - name: Dati veri per le anteprime nella release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view anteprima > /dev/null 2>&1 || gh release create anteprima --prerelease --title "gdanav · anteprima" --notes "anteprima"
          for f in prezzi_napoli.json colonnine_utrecht.json; do
            [ -s "$f" ] && gh release upload anteprima "$f" --clobber
          done
          true
      # Sui rami di lavoro: i viaggi veri per le anteprime in una release a
      # parte («lavoro»), senza toccare quella dell'app.
      - name: Dati veri per le anteprime (rami di lavoro)
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view lavoro > /dev/null 2>&1 || gh release create lavoro --prerelease --title "gdanav · dati per le anteprime (non è l'app)" --notes "Solo dati per le anteprime: l'app è nella release «anteprima»."
          for f in anteprima.json anteprima_tappa.json; do
            [ -s "$f" ] && gh release upload lavoro "$f" --clobber
          done
          true
      - name: Com'è fatto il traffico TomTom
        working-directory: .
        env:
          TOMTOM: ${{ secrets.GDANAV_TOMTOM_CHIAVE }}
        run: |
          pip install mapbox-vector-tile
          python3 tools/sonda_traffico.py

  # Le foto vere delle auto, da Wikimedia Commons: solo quando il commit lo
  # chiede con «[foto-auto]». Il JSON va nella release «anteprima», da
  # controllare e mettere in packages/gdanav_app/assets.
  foto-auto:
    if: contains(github.event.head_commit.message, '[foto-auto]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: packages/gdanav_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.4
      - run: dart pub get
      - run: dart run tool/foto_auto.dart foto_auto.json | tee foto_auto.tsv
      - name: Nella release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view anteprima > /dev/null 2>&1 || gh release create anteprima --prerelease --title "gdanav · anteprima" --notes "anteprima"
          gh release upload anteprima foto_auto.json foto_auto.tsv --clobber

  # Le colonnine rapide per l'archivio dentro l'app, dagli estratti completi
  # di OpenStreetMap (Geofabrik) filtrati con osmium: niente Overpass, che è
  # spesso sovraccarico. Solo quando il commit lo chiede con «[colonnine]»;
  # il JSON va nella release «anteprima», da mettere in packages/gdanav_app/assets.
  colonnine-dati:
    if: contains(github.event.head_commit.message, '[colonnine]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.4
      - run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - name: Estratti e colonnine
        working-directory: ${{ runner.temp }}
        run: |
          set -e
          for zona in europe/italy europe/switzerland europe/austria europe/slovenia europe/croatia \
                      europe/monaco europe/liechtenstein europe/france/provence-alpes-cote-d-azur; do
            nome=$(basename $zona)
            curl -sSfL --retry 5 -o $nome.osm.pbf https://download.geofabrik.de/$zona-latest.osm.pbf
            osmium tags-filter $nome.osm.pbf nwr/amenity=charging_station -o $nome-cs.osm.pbf
            osmium export $nome-cs.osm.pbf -f geojsonseq --add-unique-id=type_id -o $nome.colonnine.geojsonseq
            osmium tags-filter $nome.osm.pbf n/highway=speed_camera -o $nome-av.osm.pbf
            osmium export $nome-av.osm.pbf -f geojsonseq -o $nome.autovelox.geojsonseq
            echo "$nome: $(wc -l < $nome.colonnine.geojsonseq) colonnine, $(wc -l < $nome.autovelox.geojsonseq) autovelox"
            rm $nome.osm.pbf
          done
      - run: dart pub get
        working-directory: packages/gdanav_core
      - run: dart run tool/colonnine_osm.dart colonnine.json ${{ runner.temp }}/*.colonnine.geojsonseq
        working-directory: packages/gdanav_core
      - run: dart run tool/autovelox_osm.dart autovelox.json ${{ runner.temp }}/*.autovelox.geojsonseq
        working-directory: packages/gdanav_core
      - name: Nella release
        working-directory: packages/gdanav_core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view anteprima > /dev/null 2>&1 || gh release create anteprima --prerelease --title "gdanav · anteprima" --notes "anteprima"
          gh release upload anteprima colonnine.json autovelox.json --clobber

  # L'APK da provare: a ogni push su main finisce nella release «anteprima»,
  # da scaricare dal telefono.
  apk:
    runs-on: ubuntu-latest
    needs: [app, motore]
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
      - run: flutter pub get
      # Le chiavi facoltative (TomTom: traffico e colonnine libere/occupate;
      # Open Charge Map) arrivano dai segreti del repository.
      # Il numero di versione sale a ogni build: il Play Store non accetta due
      # volte lo stesso. Premium si compra anche nell'APK, come nel Play
      # Store: gdanav da sola chiede sempre l'abbonamento.
      - run: >-
          flutter build apk --release --build-number=${{ github.run_number }}
          --dart-define=GDANAV_TOMTOM_CHIAVE="$TOMTOM"
          --dart-define=GDANAV_OCM_CHIAVE="$OCM"
        env:
          TOMTOM: ${{ secrets.GDANAV_TOMTOM_CHIAVE }}
          OCM: ${{ secrets.GDANAV_OCM_CHIAVE }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk gdanav.apk
      # Il pacchetto per il Play Store (test interno): da lì Android Auto
      # mostra l'app senza «Origini sconosciute». Premium si compra, come
      # nell'APK qui sopra.
      - run: >-
          flutter build appbundle --release --build-number=${{ github.run_number }}
          --dart-define=GDANAV_TOMTOM_CHIAVE="$TOMTOM"
          --dart-define=GDANAV_OCM_CHIAVE="$OCM"
        env:
          TOMTOM: ${{ secrets.GDANAV_TOMTOM_CHIAVE }}
          OCM: ${{ secrets.GDANAV_OCM_CHIAVE }}
      - run: cp build/app/outputs/bundle/release/app-release.aab gdanav.aab
      - uses: actions/upload-artifact@v4
        with:
          name: gdanav-apk
          path: |
            app/gdanav.apk
            app/gdanav.aab
      - name: Pubblica l'anteprima
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          note="Versione di prova di gdanav, dal commit ${GITHUB_SHA::7} (versione ${GITHUB_RUN_NUMBER}). gdanav.apk si installa sul telefono aprendolo (va permesso di installare app da fonti sconosciute). gdanav.aab è il pacchetto da caricare nella Play Console, nel test interno."
          gh release view anteprima > /dev/null 2>&1 || gh release create anteprima --prerelease --title "gdanav · anteprima" --notes "$note"
          gh release upload anteprima gdanav.apk gdanav.aab --clobber
          gh release edit anteprima --notes "$note"

  # L'app per iPhone. La costruisce solo un Mac, e i Mac di GitHub costano
  # dieci volte i minuti degli altri: gira su main, sulle richieste di unione
  # e a mano, non a ogni push.
  #
  # Compila sempre (senza firma): se è verde, i plugin nativi e CarPlay stanno
  # in piedi. Con le chiavi di Apple nei segreti (vedi docs/ios.md) firma e
  # manda su TestFlight, da dove si installa sull'iPhone. Senza, finisce
  # verde lo stesso e dice cosa manca.
  iphone:
    runs-on: macos-15
    needs: [app, motore]
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # L'App Store vuole l'SDK di iOS più recente: si usa l'Xcode più nuovo
      # che la macchina ha.
      - name: L'Xcode più recente
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
      - run: flutter pub get
      # Il numero sale a ogni build: TestFlight non accetta due volte lo stesso.
      - name: Compila (senza firma)
        run: >-
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
          --dart-define=GDANAV_TOMTOM_CHIAVE="$TOMTOM"
          --dart-define=GDANAV_OCM_CHIAVE="$OCM"
        env:
          TOMTOM: ${{ secrets.GDANAV_TOMTOM_CHIAVE }}
          OCM: ${{ secrets.GDANAV_OCM_CHIAVE }}
      - name: Ci sono le chiavi di Apple?
        id: chiavi
        env:
          CHIAVE: ${{ secrets.APPLE_CHIAVE_P8 }}
          CHIAVE_ID: ${{ secrets.APPLE_CHIAVE_ID }}
          EMITTENTE: ${{ secrets.APPLE_EMITTENTE }}
          SQUADRA: ${{ secrets.APPLE_SQUADRA }}
        run: |
          if [ -n "$CHIAVE" ] && [ -n "$CHIAVE_ID" ] && [ -n "$EMITTENTE" ] && [ -n "$SQUADRA" ]; then
            echo "ci-sono=si" >> "$GITHUB_OUTPUT"
          else
            echo "ci-sono=no" >> "$GITHUB_OUTPUT"
            {
              echo "### L'app per iPhone è compilata, e non è firmata"
              echo ""
              echo "Per TestFlight servono i quattro segreti di Apple: vedi docs/ios.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # CarPlay si accende solo quando Apple ha concesso il permesso
      # (variabile GDANAV_CARPLAY = si): prima, la firma non passerebbe.
      - name: CarPlay
        if: vars.GDANAV_CARPLAY == 'si'
        run: cp ios/Runner/RunnerCarPlay.entitlements ios/Runner/Runner.entitlements
      - name: L'archivio firmato
        if: steps.chiavi.outputs.ci-sono == 'si'
        env:
          CHIAVE: ${{ secrets.APPLE_CHIAVE_P8 }}
          CHIAVE_ID: ${{ secrets.APPLE_CHIAVE_ID }}
          EMITTENTE: ${{ secrets.APPLE_EMITTENTE }}
          SQUADRA: ${{ secrets.APPLE_SQUADRA }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$CHIAVE" > ~/.appstoreconnect/private_keys/AuthKey_$CHIAVE_ID.p8
          # L'archivio si fa senza firma: con la firma automatica Xcode lo
          # firmerebbe «per sviluppo», e quel profilo vuole almeno un iPhone
          # registrato nell'account. La firma per l'App Store la mette
          # l'esportazione qui sotto: con la chiave dell'App Store Connect,
          # certificato e profilo li tiene Apple, niente nei segreti oltre a lei.
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner -configuration Release -sdk iphoneos \
            -archivePath build/gdanav.xcarchive archive \
            DEVELOPMENT_TEAM="$SQUADRA" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      # Su TestFlight solo da main (o a mano): le richieste di unione si
      # fermano all'archivio firmato.
      - name: Su TestFlight
        if: steps.chiavi.outputs.ci-sono == 'si' && github.event_name != 'pull_request'
        env:
          CHIAVE_ID: ${{ secrets.APPLE_CHIAVE_ID }}
          EMITTENTE: ${{ secrets.APPLE_EMITTENTE }}
          SQUADRA: ${{ secrets.APPLE_SQUADRA }}
        run: |
          cat > build/esporta.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$SQUADRA</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>upload</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/gdanav.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/esporta.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$CHIAVE_ID.p8 \
            -authenticationKeyID "$CHIAVE_ID" \
            -authenticationKeyIssuerID "$EMITTENTE"
          {
            echo "### gdanav ${{ github.run_number }} su TestFlight"
            echo ""
            echo "Fra qualche minuto arriva la notifica di Apple: da TestFlight sull'iPhone si installa."
          } >> "$GITHUB_STEP_SUMMARY"

  # gdahome si aggiorna da sola a ogni gdanav nuovo su main: le si dice che
  # c'è, e il suo workflow «Aggiorna gdanav» porta il nuovo pacchetto, fa le
  # prove e apre la richiesta di unione. Serve il segreto GDAHOME_TOKEN (un
  # token con permesso Actions e Contents su danigio15/gdahomeapp): senza,
  # gdahome se ne accorge lo stesso al suo giro di ogni notte.
  avvisa-gdahome:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [app, motore]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GDAHOME_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::gdahome non avvisata: manca il segreto GDAHOME_TOKEN. Si aggiornerà al suo giro di ogni notte."
            exit 0
          fi
          gh api repos/danigio15/gdahomeapp/dispatches \
            -f event_type=gdanav-aggiornato \
            -f "client_payload[commit]=$GITHUB_SHA"
