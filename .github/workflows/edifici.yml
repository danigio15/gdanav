# Gli edifici d'Italia per la scena 3D, da Overture Maps.
#
# «Lungo il percorso voglio vedere le cose reali.» OpenStreetMap in molti
# paesi gli edifici non li ha; Overture unisce i suoi a quelli che Microsoft
# ha ricavato dalle foto dal satellite. Qui si preparano i pacchetti, uno per
# cella z8 (circa 150 km di lato), e si mettono nella release «edifici» di
# questo repository: l'app scarica quello della zona una volta e lo legge dal
# telefono (nessun server da chiamare, nessun limite). Dati ODbL.
#
# Si rifà una volta al mese (Overture esce ogni mese) o a mano, scegliendo
# il rilascio di Overture.
name: edifici

on:
  workflow_dispatch:
    inputs:
      rilascio:
        description: "Rilascio di Overture (es. 2026-10-21.0); vuoto: l'ultimo"
        required: false
        default: ""
  schedule:
    - cron: "17 3 2 * *"

permissions:
  contents: write

concurrency:
  group: edifici
  cancel-in-progress: false

jobs:
  celle:
    runs-on: ubuntu-latest
    outputs:
      celle: ${{ steps.c.outputs.celle }}
      rilascio: ${{ steps.r.outputs.rilascio }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pyarrow shapely mapbox-vector-tile pmtiles
      - id: r
        name: Il rilascio di Overture
        # L'input passa da una variabile, non dentro lo script: scritto lì,
        # una virgoletta nel campo diventava un comando.
        env:
          RILASCIO: ${{ github.event.inputs.rilascio }}
        run: |
          r="$RILASCIO"
          if [ -n "$r" ] && ! [[ "$r" =~ ^[0-9A-Za-z._-]+$ ]]; then echo "rilascio non valido: $r"; exit 1; fi
          if [ -z "$r" ]; then
            r=$(curl -s "https://overturemaps-us-west-2.s3.us-west-2.amazonaws.com/?list-type=2&prefix=release/&delimiter=/" \
              | grep -o '<Prefix>release/[^<]*/</Prefix>' | sed 's#<Prefix>release/##; s#/</Prefix>##' | sort | tail -1)
          fi
          echo "rilascio=$r" >> "$GITHUB_OUTPUT"
          echo "Overture $r"
      - id: c
        run: echo "celle=$(python strumenti/edifici/prepara.py --italia --elenco)" >> "$GITHUB_OUTPUT"

  prepara:
    needs: celle
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        cella: ${{ fromJson(needs.celle.outputs.celle) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pyarrow shapely mapbox-vector-tile pmtiles
      - name: Il pacchetto della cella
        id: p
        run: |
          set -o pipefail
          python strumenti/edifici/prepara.py --cella "${{ matrix.cella }}" --rilascio "${{ needs.celle.outputs.rilascio }}" --uscita pacchetti | tee esito.json
          echo "nome=$(echo '${{ matrix.cella }}' | tr / -)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edifici-${{ steps.p.outputs.nome }}
          path: |
            pacchetti/
            esito.json
          if-no-files-found: ignore

  pubblica:
    needs: [celle, prepara]
    if: always() && needs.celle.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: tutti
      - name: L'indice dei pacchetti
        run: |
          mkdir -p uscita
          # Solo i pacchetti veri: un file vuoto o rovinato la release lo rifiuta.
          find tutti -name '*.pmtiles' -size +126c -exec mv {} uscita/ \;
          python3 - <<'PY'
          import json, glob, os
          voci = {}
          for f in glob.glob("tutti/*/esito.json"):
              for riga in open(f):
                  if not riga.strip():
                      continue
                  e = json.loads(riga)
                  nome = "edifici-" + e["cella"].replace("/", "-") + ".pmtiles"
                  p = "uscita/" + nome
                  if os.path.exists(p) and open(p, "rb").read(8) == b"PMTiles\x03":
                      voci[e["cella"]] = {"file": nome, "byte": os.path.getsize("uscita/" + nome), "edifici": e["edifici"]}
          json.dump({"rilascio_overture": "${{ needs.celle.outputs.rilascio }}", "zoom_celle": 8, "celle": voci,
                     "attribuzione": "© OpenStreetMap, Overture Maps Foundation, Microsoft (ODbL)"},
                    open("uscita/indice.json", "w"))
          print(len(voci), "pacchetti", round(sum(v["byte"] for v in voci.values()) / 1e9, 2), "GB")
          PY
      - name: Nella release «edifici»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view edifici > /dev/null 2>&1 || gh release create edifici --prerelease \
            --title "GdANav · edifici per la scena 3D (non è l'app)" \
            --notes "Gli edifici d'Italia da Overture Maps, un pacchetto PMTiles per cella z8, per la scena 3D di GdANav. Dati ODbL: © OpenStreetMap, Overture Maps Foundation, Microsoft."
          # Uno alla volta, riprovando: con un centinaio di pacchetti un caricamento
          # che cade non deve fermare gli altri. L'indice per ultimo, cosi' l'app
          # non chiede mai un pacchetto che non c'e' ancora.
          falliti=0
          for f in uscita/*.pmtiles uscita/indice.json; do
            [ -e "$f" ] || continue
            ok=0
            for prova in 1 2 3 4; do
              if gh release upload edifici "$f" --clobber; then ok=1; break; fi
              sleep $((prova * 5))
            done
            [ $ok = 1 ] || { echo "::error::non caricato: $f"; falliti=$((falliti + 1)); }
          done
          [ $falliti = 0 ]
